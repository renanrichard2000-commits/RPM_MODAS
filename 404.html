<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>RPM MODAS | Redirecionando...</title>
  <script>
    /**
     * Roteamento SPA compatível com GitHub Pages (/RPM_MODAS/produto/slug)
     * Evita erro 404 ao acessar diretamente ou atualizar páginas internas.
     */
    (function () {
      var l = window.location;
      var isRepoSubpath =
        l.hostname.indexOf("github.io") !== -1 ||
        l.pathname.toLowerCase().indexOf("/rpm_modas/") === 0;
      var segmentsToKeep = isRepoSubpath ? 1 : 0;

      var basePath = l.pathname
        .split("/")
        .slice(0, 1 + segmentsToKeep)
        .join("/");

      var routePath = l.pathname
        .slice(1)
        .split("/")
        .slice(segmentsToKeep)
        .join("/");

      var extraQuery = l.search ? "&q=" + encodeURIComponent(l.search.slice(1)) : "";
      var target =
        l.protocol +
        "//" +
        l.hostname +
        (l.port ? ":" + l.port : "") +
        basePath +
        "/?p=/" +
        encodeURIComponent(routePath).replace(/%2F/g, "/") +
        extraQuery +
        l.hash;

      l.replace(target);
    })();
  </script>
</head>
<body></body>
</html>
